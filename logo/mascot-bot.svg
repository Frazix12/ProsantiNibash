<!--
  Prosanti Nibash — Nibash Bot v4 (final polish)
  - Left arm pulled inward 8px
  - Smile thicker and more visible
  - Happy squint eyelid curves above eyes
  - Rounder cuter feet
  - Bolt details on head sides
  - Small ear-nub details on head
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 280" width="256" height="280"
     role="img" aria-labelledby="title-bot">
  <title id="title-bot">Prosanti Nibash — Nibash Bot</title>

  <!-- ── ANTENNA ── -->
  <rect x="123" y="8" width="10" height="26" rx="5" fill="#2D6A4F"/>
  <circle cx="128" cy="8"  r="14" fill="#52B788"/>
  <circle cx="123" cy="4"  r="5"  fill="#B7E4C7" opacity="0.9"/>

  <!-- ── HEAD ear-nubs (bolt mounts) ── -->
  <rect x="18"  y="58" width="14" height="28" rx="7" fill="#2D6A4F"/>
  <rect x="224" y="58" width="14" height="28" rx="7" fill="#2D6A4F"/>

  <!-- ── HEAD ── -->
  <rect x="28" y="22" width="200" height="114" rx="32" fill="#52B788"/>
  <!-- Top highlight -->
  <ellipse cx="100" cy="36" rx="54" ry="10" fill="#B7E4C7" opacity="0.28"/>

  <!-- Head bolt screws -->
  <circle cx="46"  cy="40" r="6" fill="#2D6A4F"/>
  <circle cx="46"  cy="40" r="2" fill="#1B4332"/>
  <circle cx="210" cy="40" r="6" fill="#2D6A4F"/>
  <circle cx="210" cy="40" r="2" fill="#1B4332"/>

  <!-- ── LEFT EYE ── -->
  <circle cx="86"  cy="76" r="30" fill="#ffffff"/>
  <circle cx="86"  cy="76" r="19" fill="#1B4332"/>
  <circle cx="86"  cy="76" r="9"  fill="#052e16"/>
  <circle cx="95"  cy="67" r="7"  fill="#ffffff"/>
  <circle cx="79"  cy="83" r="3"  fill="#ffffff" opacity="0.45"/>
  <!-- Happy eyelid squint -->
  <path fill="none" stroke="#2D6A4F" stroke-width="5" stroke-linecap="round"
    d="M58 58 Q86 48 114 58"/>

  <!-- ── RIGHT EYE ── -->
  <circle cx="170" cy="76" r="30" fill="#ffffff"/>
  <circle cx="170" cy="76" r="19" fill="#1B4332"/>
  <circle cx="170" cy="76" r="9"  fill="#052e16"/>
  <circle cx="179" cy="67" r="7"  fill="#ffffff"/>
  <circle cx="163" cy="83" r="3"  fill="#ffffff" opacity="0.45"/>
  <!-- Happy eyelid squint -->
  <path fill="none" stroke="#2D6A4F" stroke-width="5" stroke-linecap="round"
    d="M142 58 Q170 48 198 58"/>

  <!-- Cheeks -->
  <ellipse cx="50"  cy="98" rx="14" ry="9" fill="#B7E4C7" opacity="0.6"/>
  <ellipse cx="206" cy="98" rx="14" ry="9" fill="#B7E4C7" opacity="0.6"/>

  <!-- ── MOUTH PANEL ── -->
  <rect x="72" y="110" width="112" height="24" rx="12" fill="#1B4332"/>
  <!-- Smile: thick, curves UP -->
  <path fill="none" stroke="#52B788" stroke-width="6" stroke-linecap="round"
    d="M86 126 Q128 110 170 126"/>

  <!-- ── NECK ── -->
  <rect x="108" y="136" width="40" height="12" rx="6" fill="#2D6A4F"/>

  <!-- ── BODY ── -->
  <rect x="40" y="146" width="176" height="82" rx="28" fill="#52B788"/>
  <ellipse cx="104" cy="153" rx="46" ry="9" fill="#B7E4C7" opacity="0.26"/>

  <!-- ── CHEST PANEL ── -->
  <rect x="74" y="158" width="108" height="58" rx="14" fill="#1B4332"/>
  <rect x="86" y="168" width="84" height="7" rx="3.5" fill="#52B788" opacity="0.8"/>
  <rect x="86" y="180" width="60" height="7" rx="3.5" fill="#52B788" opacity="0.6"/>
  <rect x="86" y="192" width="72" height="7" rx="3.5" fill="#52B788" opacity="0.5"/>

  <!-- ── LEFT ARM (pulled in 8px from edge) ── -->
  <rect x="22"  y="158" width="22" height="16" rx="8" fill="#2D6A4F"/>
  <rect x="18"  y="172" width="22" height="16" rx="8" fill="#2D6A4F"
        transform="rotate(18 29 180)"/>
  <circle cx="24" cy="200" r="13" fill="#52B788"/>
  <circle cx="20" cy="196" r="4"  fill="#B7E4C7" opacity="0.55"/>

  <!-- ── RIGHT ARM ── -->
  <rect x="212" y="158" width="22" height="16" rx="8" fill="#2D6A4F"/>
  <rect x="216" y="172" width="22" height="16" rx="8" fill="#2D6A4F"
        transform="rotate(-18 227 180)"/>
  <circle cx="232" cy="200" r="13" fill="#52B788"/>
  <circle cx="236" cy="196" r="4"  fill="#B7E4C7" opacity="0.55"/>

  <!-- ── LEGS ── -->
  <rect x="84"  y="224" width="36" height="28" rx="14" fill="#2D6A4F"/>
  <rect x="140" y="224" width="36" height="28" rx="14" fill="#2D6A4F"/>

  <!-- ── FEET (rounded, cute) ── -->
  <rect x="76"  y="244" width="48" height="16" rx="10" fill="#1B4332"/>
  <rect x="132" y="244" width="48" height="16" rx="10" fill="#1B4332"/>

</svg>
