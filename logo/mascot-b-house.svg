<!--
  Mascot B v2: "Happy House" — refined
  Softer roof (less sharp), bigger rounder body, eyes are cuter circles not squares,
  smile is a proper curved arc (not a door), separate door below smile.
  More kawaii proportions.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-labelledby="title-house">
  <title id="title-house">Prosanti Nibash — Happy House</title>

  <!-- Chimney -->
  <rect x="76" y="50" width="18" height="42" rx="5" fill="#1A2A50"/>
  <!-- Chimney puff -->
  <circle cx="85" cy="44" r="10" fill="#D0D8E8" opacity="0.8"/>
  <circle cx="78" cy="38" r="7" fill="#D0D8E8" opacity="0.6"/>

  <!-- Roof: softer wider triangle with rounded apex -->
  <path fill="#2C3E6B"
    d="M128 22 Q133 22 137 27 L240 130 Q244 136 238 136 L18 136 Q12 136 16 130 Z"/>

  <!-- Body: tall rounded rectangle -->
  <rect x="18" y="122" width="220" height="120" rx="20" fill="#F4A261"/>

  <!-- Left eye: big round white with pupil -->
  <circle cx="90" cy="160" r="26" fill="#ffffff"/>
  <circle cx="94" cy="162" r="14" fill="#2C3E6B"/>
  <circle cx="99" cy="157" r="5" fill="#ffffff"/>
  <!-- Eyelid curve (happy squint line above) -->
  <path fill="none" stroke="#2C3E6B" stroke-width="4" stroke-linecap="round"
    d="M66 144 Q90 136 114 144"/>

  <!-- Right eye -->
  <circle cx="166" cy="160" r="26" fill="#ffffff"/>
  <circle cx="170" cy="162" r="14" fill="#2C3E6B"/>
  <circle cx="175" cy="157" r="5" fill="#ffffff"/>
  <!-- Eyelid curve right -->
  <path fill="none" stroke="#2C3E6B" stroke-width="4" stroke-linecap="round"
    d="M142 144 Q166 136 190 144"/>

  <!-- Rosy cheeks -->
  <ellipse cx="50" cy="178" rx="20" ry="12" fill="#E07A3A" opacity="0.4"/>
  <ellipse cx="206" cy="178" rx="20" ry="12" fill="#E07A3A" opacity="0.4"/>

  <!-- Smile: clean upward arc -->
  <path fill="none" stroke="#2C3E6B" stroke-width="6" stroke-linecap="round"
    d="M94 192 Q128 214 162 192"/>

  <!-- Door: small arch at bottom center -->
  <path fill="#2C3E6B"
    d="M104 242 L104 216 A24 24 0 0 1 152 216 L152 242 Z"/>

  <!-- Door knob -->
  <circle cx="150" cy="232" r="4" fill="#F4A261"/>

  <!-- Windows left and right of door (small) -->
  <rect x="42" y="196" width="36" height="32" rx="8" fill="#FDDCB5"/>
  <rect x="178" y="196" width="36" height="32" rx="8" fill="#FDDCB5"/>
</svg>
