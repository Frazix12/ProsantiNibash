<!--
  Concept B: "Stacked Floors"
  Three horizontal bars of decreasing width, stacked with consistent gaps.
  Reads as: building floors, a ledger, an upward-narrowing tower.
  Subtly suggests growth and organized management. Very clean, app-icon-safe.
  viewBox 256x256.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-labelledby="title-b">
  <title id="title-b">Prosanti Nibash — Stacked Floors</title>

  <!-- Three bars: bottom widest, top narrowest. Heights: 40px each. Gaps: 20px. -->
  <!-- Total height: 3*40 + 2*20 = 160. Centered vertically: y_start = (256-160)/2 = 48 -->

  <!-- Bar 1 (bottom): full width = 192, x=(256-192)/2=32, y=168, h=40, rx=8 -->
  <rect x="32"  y="168" width="192" height="40" rx="8" fill="#2C3E6B"/>

  <!-- Bar 2 (middle): width = 144, x=(256-144)/2=56, y=108, h=40, rx=8 -->
  <rect x="56"  y="108" width="144" height="40" rx="8" fill="#2C3E6B"/>

  <!-- Bar 3 (top): width = 96, x=(256-96)/2=80, y=48, h=40, rx=8 -->
  <rect x="80"  y="48"  width="96"  height="40" rx="8" fill="#2C3E6B"/>

</svg>
