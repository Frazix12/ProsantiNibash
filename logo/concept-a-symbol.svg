<!--
  Concept A v2: "Calm Roof" — refined
  Clean geometric house: sharp isoceles triangle roof + solid rectangular body + arch doorway cutout.
  The arch door echoes peace and openness. Very minimal, landlord-readable.
  Proportions: padding=24, roof apex at top, body fills lower half.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-labelledby="title-a">
  <title id="title-a">Prosanti Nibash — Calm Roof</title>

  <!--
    Roof triangle: apex (128,28), base-left (28,136), base-right (228,136)
    Body rect: x=60, y=136, w=136, h=96  → bottom y=232
    Merged as one path; door arch cut out.
    Door: centered at x=128, arch top center=(128,188), radius=24, base y=232
    Door arch: semicircle from (104,188) to (152,188), top at (128,164)
    Door rect below arch: x=104, y=188, w=48, h=44
  -->

  <path fill="#2C3E6B" fill-rule="evenodd"
    d="
      M 128 28
      L 228 136
      L 196 136
      L 196 232
      L 60 232
      L 60 136
      L 28 136
      Z
      M 104 232
      L 104 188
      A 24 24 0 0 1 152 188
      L 152 232
      Z
    "/>
</svg>
